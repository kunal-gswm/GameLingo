name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: "pyproject.toml"

      - name: Install dependencies
        run: uv sync --locked --extra gui --extra argos --group build

      - name: Run checks
        run: |
          uv run pytest
          uv run ruff check .
          uv run ruff format --check .

      - name: Build with PyInstaller
        run: |
          uv run pyinstaller --name GameLingo --onedir --noconfirm --noconsole --clean --hidden-import argostranslate src/gamelingo/gui/main.py

      - name: Prepare distribution
        run: |
          Copy-Item README.md dist/GameLingo/
          Copy-Item LICENSE dist/GameLingo/
          Copy-Item README_FIRST_RUN.txt dist/GameLingo/
          Copy-Item THIRD_PARTY_NOTICES.txt dist/GameLingo/
          Compress-Archive -Path dist/GameLingo -DestinationPath dist/GameLingo-Windows-x64.zip
          $hash = Get-FileHash dist/GameLingo-Windows-x64.zip -Algorithm SHA256
          $hash.Hash | Out-File dist/GameLingo-Windows-x64.zip.sha256 -Encoding UTF8
          
          # Create build manifest
          $manifest = @{
              version = "${{ github.ref_name }}"
              commit = "${{ github.sha }}"
              python_version = (uv run python --version)
              architecture = "x64"
          }
          $manifest | ConvertTo-Json | Out-File dist/build_manifest.json -Encoding UTF8

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GameLingo-Windows-x64
          path: |
            dist/GameLingo-Windows-x64.zip
            dist/GameLingo-Windows-x64.zip.sha256
            dist/build_manifest.json
