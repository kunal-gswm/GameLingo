[project]
name = "gamelingo"
version = "0.1.0"
description = "A local-first game translation patch workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
gamelingo = "gamelingo.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.3.0",
]
